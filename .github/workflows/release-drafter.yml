name: Release Drafter

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          prerelease: true
          prerelease-identifier: alpha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
