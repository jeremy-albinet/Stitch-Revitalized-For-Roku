name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Audit dependencies against reviewed policy
        run: npm run audit
      - run: npm run lint
      - run: npm run fmt:check
      - name: Execute offline fixtures and tooling regressions
        run: npm test
      - name: Compile device tests
        run: npm run test:compile
      - name: Create channel package
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: roku-package
          path: out/Stitch-Revitalized-For-Roku.zip
          if-no-files-found: error
          retention-days: 7
