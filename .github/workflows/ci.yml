name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '23.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Security audit
      run: npm run audit
      
    - name: Run linting
      run: npm run lint

    - name: Check code formatting
      run: npm run fmt:check
      
    - name: Create package
      run: npm run package
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: roku-package
        path: out/Stitch-Revitalized-For-Roku.zip
        retention-days: 7

  # Roku's own certification checker (the same rules as the dashboard's Static Analysis step).
  # Always fetches the latest sca-cmd so new deprecations surface here, not at submission.
  static-analysis:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Download package
      uses: actions/download-artifact@v7
      with:
        name: roku-package

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'

    - name: Install Roku Static Analysis (sca-cmd)
      run: |
        curl -sSfL -o "$RUNNER_TEMP/sca-cmd.zip" https://devtools.web.roku.com/static-channel-analysis/sca-cmd.zip
        unzip -q "$RUNNER_TEMP/sca-cmd.zip" -d "$RUNNER_TEMP"

    - name: Run static analysis
      run: '"$RUNNER_TEMP/sca-cmd/bin/sca-cmd" Stitch-Revitalized-For-Roku.zip --exit error'