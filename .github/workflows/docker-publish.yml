name: Docker build and publish

on:
  push:
    branches: [main]
    paths:
      - 'fmp4-demux-proxy/**'
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/proxy-ci.yml'
    tags: ['proxy-v*']
  pull_request:
    branches: [main]
    paths:
      - 'fmp4-demux-proxy/**'
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/proxy-ci.yml'

permissions:
  contents: read

jobs:
  validate-python:
    name: Validate Python source and runtime dependencies
    uses: ./.github/workflows/proxy-ci.yml

  validate:
    name: Build container and check health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag stitch-proxy-ci ./fmp4-demux-proxy
      - name: Check running service
        timeout-minutes: 2
        run: |
          docker run --detach --name stitch-proxy-smoke \
            --publish 127.0.0.1:18080:8080 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 1g --pids-limit 64 stitch-proxy-ci
          # Docker can publish the port before aiohttp is ready, resetting early connections.
          curl --fail --silent --show-error --retry 30 --retry-all-errors \
            --retry-delay 1 --retry-max-time 30 --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:18080/health
      - name: Container logs
        if: failure()
        run: docker logs stitch-proxy-smoke
      - name: Remove smoke container
        if: always()
        run: docker rm --force stitch-proxy-smoke

  publish:
    name: Publish main or release image
    needs: [validate, validate-python]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fmp4-demux-proxy
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=match,pattern=proxy-v(.*),group=1
      - uses: docker/build-push-action@v7
        with:
          context: ./fmp4-demux-proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
